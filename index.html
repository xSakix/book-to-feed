<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>book to feed</title>
    <meta
      name="description"
      content="Read an EPUB as a social feed. Your books never leave this device."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      No inline bootstrap script here on purpose: the CSP in public/_headers is
      script-src 'self', which blocks inline script. The app is client-rendered,
      so the theme is applied by main.tsx before anything paints.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
